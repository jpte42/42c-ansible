---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Deploy monitoring reverse-proxy vhost
  ansible.builtin.template:
    src: monitoring.conf.j2
    dest: /etc/nginx/sites-available/monitoring.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable monitoring vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/monitoring.conf
    dest: /etc/nginx/sites-enabled/monitoring.conf
    state: link
  notify: Reload nginx

- name: Ensure nginx is running and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
